# Gitea Actions. See .cicd/ci.yml for why workflows live in this directory.
#
# Builds GNU bash 3.2.57, the bash macOS ships, as a static binary for
# linux/amd64 and linux/arm64 (runfiles/macos-bash/) -- one job each, on a runner
# that can run that platform -- and publishes each with its .sha256 from a third
# job to git.joaoverona.com's generic package registry as
# bash/<version>/bash-<version>-linux-<arch>, linked to this repository: the
# second pass of `run test` and `run ci:test` downloads it from there with no
# token (`_macos-bash`). A published version is never replaced: a rebuild of the
# same release publishes nothing, and a different build under the same version
# fails here instead of in every test run, as a checksum that no longer matches
# its pin.
#
# It has no GitHub counterpart: the registry is Gitea's, and GitHub's runners
# only download from it.
name: bash 3.2

on:
  push:
    branches: [master]
    paths:
      - ".cicd/macos-bash.yml"
      - "runfiles/macos-bash/**"
  workflow_dispatch:

# Least privilege: the job token is read-only. Publishing goes through
# REGISTRY_TOKEN, which only the publish step is given.
permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: macos-bash-${{ gitea.ref }}

jobs:
  # One job per architecture, each on a runner that can run it, and a third that
  # publishes what both made.
  #
  # The arm64 build needs QEMU registered on the machine's own kernel, which only
  # the runner installed with --x64-to-arm64 has -- the one behind
  # ubuntu-24.04-arm, as gitea-easy-runners' own docker-multiarch job runs on. A
  # plain ubuntu-24.04 runner has none, and nothing a job runs can register one
  # there: the engine is rootless, so docker/setup-qemu-action's --privileged
  # install reports "installing: arm64 OK" and registers nothing the next
  # container can see, which is how runs 2640 and 2706 stopped at `exec format
  # error`. The amd64 build stays on ubuntu-24.04, native. `macos-bash:build`
  # checks that its platform runs before it builds anything.
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          # Its own steps run emulated too -- this job's container is aarch64 --
          # so building `run` here is slower than on the other leg. The workflow
          # runs when the recipe changes, which is rarely.
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      # Only to build `run` itself, which compiles nothing worth caching here.
      - name: Rust toolchain
        uses: https://git.joaoverona.com/joaaoverona/shared-actions/rust-toolchain-and-cache@v1
        with:
          cache: false

      # From source, like every job here that runs a target: the released CLI
      # is a previous version of this repository's own task files, so it breaks
      # exactly when the language changes.
      - name: Setup Runfile (from source)
        uses: ./.github/actions/setup
        with:
          from-source: true

      # A container of the pinned Alpine for this platform.
      - name: Build the binary
        run: run macos-bash:build --platform=linux/${{ matrix.arch }}

      - name: Upload it
        uses: https://git.joaoverona.com/joaaoverona/shared-actions/gitea-upload-artifact@v1
        with:
          if-no-files-found: error
          name: bash-linux-${{ matrix.arch }}
          path: target-macos-bash/*

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: https://git.joaoverona.com/joaaoverona/shared-actions/rust-toolchain-and-cache@v1
        with:
          cache: false

      - name: Setup Runfile (from source)
        uses: ./.github/actions/setup
        with:
          from-source: true

      # Both binaries and their .sha256, where `macos-bash:publish` reads them.
      - name: Download the binaries
        uses: https://git.joaoverona.com/joaaoverona/shared-actions/gitea-download-artifact@v1
        with:
          merge-multiple: true
          path: target-macos-bash

      - name: Publish them and link the package to this repository
        run: run macos-bash:publish
        env:
          GITEA_URL: ${{ gitea.server_url }}
          OWNER: ${{ gitea.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REPOSITORY: ${{ gitea.repository }}
