# Gitea Actions. See .cicd/ci.yml for why workflows live in this directory.
#
# Every release is cut here, and it is the one installed binaries update from:
# `run :update` and both installers default to this instance
# (crates/runfile-cli/src/cmd_update.rs, .cicd/release-assets/). GitHub is a
# mirror that `run mirror` pushes when it is wanted, and its release workflow
# then mirrors the newest version -- the archives the setup action installs,
# the `v1` alias consumers pin it by, and the npm package. npm is only there
# because its trusted publishing accepts only GitHub's OIDC issuer, and a
# version can be published once, so exactly one side does it.
#
# The same six targets as GitHub, on the runners this fleet has:
#
#   target                        runner         how
#   aarch64-apple-darwin          macos-26       cross-compiled: the Mac is Intel
#   aarch64-pc-windows-msvc       windows-2025   cross-compiled with MSVC's ARM64 tools
#   aarch64-unknown-linux-musl    ubuntu-24.04   cross-compiled, zig links (rust-cross-linux)
#   x86_64-apple-darwin           macos-26       native
#   x86_64-pc-windows-msvc        windows-2025   native
#   x86_64-unknown-linux-musl     ubuntu-24.04   native, musl-tools
#
# Nothing goes to ubuntu-24.04-arm: that is qemu-user emulating the compiler on
# an x86-64 machine, and the zig cross-link does the same job at native speed.
# Windows builds natively rather than through rust-cross-windows' cargo-xwin,
# which would keep it off the fleet's one Windows runner: `+crt-static` lives in
# .cargo/config.toml, and cargo's own MSVC build is the path it is known to
# survive into the binary. A release is rare enough that the queue is the
# cheaper risk.
#
# Archives keep the layout the installers, the setup action and npm all read:
# `runfile-cli-<target>/run[.exe]` beside the README, as .tar.xz, or .zip on
# Windows.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true

jobs:
  build:
    name: Build (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-musl
          - runner: macos-26
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || gitea.ref_name }}

      # See .cicd/ci.yml: the release is then built by the toolchain CI tested,
      # not by whichever host ABI this runner's rustup happened to settle on.
      - name: Name the MSVC host toolchain
        id: host
        if: contains(matrix.platform.target, 'windows')
        shell: bash
        run: echo "toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)-x86_64-pc-windows-msvc" >> "$GITEA_OUTPUT"

      # Uncached, like every release build in the fleet: `--release` shares no
      # artifact with CI, and a stale object in a release target/ would ship.
      - name: Rust toolchain
        uses: https://git.joaoverona.com/joaaoverona/shared-actions/rust-toolchain-and-cache@v1
        with:
          cache: false
          target: ${{ matrix.platform.target }}
          toolchain: ${{ steps.host.outputs.toolchain }}

      # xz-utils is what GNU tar shells out to for `-J`, and is not in every
      # base image.
      - name: Install musl and archive tooling
        if: contains(matrix.platform.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools xz-utils

      - name: Setup cross environment
        if: matrix.platform.target == 'aarch64-unknown-linux-musl'
        uses: https://git.joaoverona.com/joaaoverona/shared-actions/rust-cross-linux@v1
        with:
          targets: aarch64-unknown-linux-musl

      # From source, never the released CLI: this job runs during the release
      # that publishes it, so `latest` is always the previous version. Before
      # CARGO_BUILD_TARGET is set, so the bootstrap is for the host that runs it.
      - name: Setup Runfile (from source)
        uses: ./.github/actions/setup
        with:
          from-source: true

      - name: Build release binary
        run: run ci:build
        env:
          CARGO_BUILD_TARGET: ${{ matrix.platform.target }}

      - name: Package archive
        if: ${{ !contains(matrix.platform.target, 'windows') }}
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: |
          set -euo pipefail
          dir="runfile-cli-$TARGET"
          mkdir "$dir"
          cp "target/$TARGET/release/run" README.md "$dir/"
          tar -cJf "$dir.tar.xz" "$dir"

      # Compress-Archive because the fleet's Windows runner has no 7-Zip, which
      # GitHub's image does. PowerShell 7 rather than 5.1: 5.1's writes `\` into
      # entry names, and unzip on Linux and macOS reads that as part of the name.
      - name: Package archive (Windows)
        if: contains(matrix.platform.target, 'windows')
        shell: pwsh
        env:
          TARGET: ${{ matrix.platform.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "runfile-cli-$env:TARGET"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item "target/$env:TARGET/release/run.exe", README.md -Destination $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: Upload artifact
        uses: https://git.joaoverona.com/joaaoverona/shared-actions/gitea-upload-artifact@v1
        with:
          if-no-files-found: error
          name: ${{ matrix.platform.target }}
          path: |
            runfile-cli-*.tar.xz
            runfile-cli-*.zip

  extension:
    name: Package VS Code extension
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || gitea.ref_name }}

      # Must precede setup-node: `cache: pnpm` needs the pnpm binary to resolve
      # the store path. The version comes from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: editors/vscode/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editors/vscode/pnpm-lock.yaml

      - name: Verify tag matches the extension version
        working-directory: editors/vscode
        env:
          TAG: ${{ inputs.tag || gitea.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "extension version: $version | tag: ${TAG#v}"
          test "$version" = "${TAG#v}"

      - name: Rust toolchain
        uses: https://git.joaoverona.com/joaaoverona/shared-actions/rust-toolchain-and-cache@v1
        with:
          cache: false

      - name: Setup Runfile (from source)
        uses: ./.github/actions/setup
        with:
          from-source: true

      - name: Install extension dependencies
        run: run vscode:setup

      - name: Compile and package extension
        run: run vscode:package --out="runfile-vscode-${TAG#v}.vsix"
        env:
          TAG: ${{ inputs.tag || gitea.ref_name }}

      - name: Upload artifact
        uses: https://git.joaoverona.com/joaaoverona/shared-actions/gitea-upload-artifact@v1
        with:
          if-no-files-found: error
          name: vscode-extension
          path: editors/vscode/runfile-vscode-*.vsix

  release:
    name: Publish Gitea release
    needs: [build, extension]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || gitea.ref_name }}

      # Also hands the bare version to `required` below, which has to name the
      # .vsix and has no way of its own to drop the `v`.
      - name: Verify tag matches the workspace version
        id: version
        env:
          TAG: ${{ inputs.tag || gitea.ref_name }}
        run: |
          grep -Fxq "version = \"${TAG#v}\"" Cargo.toml
          echo "version=${TAG#v}" >> "$GITEA_OUTPUT"

      - name: Download artifacts
        uses: https://git.joaoverona.com/joaaoverona/shared-actions/gitea-download-artifact@v1
        with:
          merge-multiple: true
          path: dist

      - name: Stage installers
        run: cp .cicd/release-assets/install.sh .cicd/release-assets/install.ps1 dist/

      # `v*.*.*` also matches `v1.3.0-rc.1`. Marked a prerelease, Gitea leaves it
      # out of `latest` -- which is what `run :update` and both installers fetch,
      # so an unmarked one would be installed by every update that ran after it.
      - name: Publish release
        uses: https://git.joaoverona.com/joaaoverona/shared-actions/gitea-release@v1
        with:
          tag: ${{ inputs.tag || gitea.ref_name }}
          token: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
          assets: dist/*
          checksums: sha256.sum
          prerelease: ${{ contains(inputs.tag || gitea.ref_name, '-') }}
          required: |
            runfile-cli-aarch64-apple-darwin.tar.xz
            runfile-cli-aarch64-pc-windows-msvc.zip
            runfile-cli-aarch64-unknown-linux-musl.tar.xz
            runfile-cli-x86_64-apple-darwin.tar.xz
            runfile-cli-x86_64-pc-windows-msvc.zip
            runfile-cli-x86_64-unknown-linux-musl.tar.xz
            runfile-vscode-${{ steps.version.outputs.version }}.vsix
            install.sh
            install.ps1
