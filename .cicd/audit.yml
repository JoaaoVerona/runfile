# Gitea Actions. See .cicd/ci.yml for why workflows live in this directory, and
# why the toolchain's cache is off here too -- though an audit builds nothing
# worth caching anyway.
name: Security audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege: the job token is read-only. A job that must publish grants
# itself `contents: write` explicitly; the steps that run third-party code
# (cargo, npx, build scripts) stay read-only, so a compromised dependency cannot
# rewrite a published release through the token actions/checkout persists.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: https://git.joaoverona.com/joaaoverona/shared-actions/rust-toolchain-and-cache@v1
        with:
          cache: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # From source: the released CLI is a previous version of this
      # repository's own task files, so driving them with it breaks whenever
      # the language changes.
      - name: Setup Runfile (from source)
        uses: ./.github/actions/setup
        with:
          from-source: true

      - name: Audit dependencies
        run: run audit
