name: Cleanup Runfile
description: Removes the global settings and materialized secret files this job left on the runner

# Composite actions cannot declare a `post` step (only JavaScript/Docker actions
# can), so the teardown counterpart of `setup` has to be an action the workflow
# invokes itself. Add it as the last step of every job that uses `setup`, with
# `if: always()`, so a failed or cancelled job still cleans up.
#
# Removes the machine-global settings directory (global files, path aliases,
# shell paths, prepare state) and `$RUNNER_TEMP/runfile-source/`, where the
# `runfile-source` / `env-file-source` inputs write their contents.
#
# This is a no-op on GitHub-hosted runners — the whole VM is discarded — but it
# is what keeps self-hosted runners, whose `$HOME` persists across jobs and whose
# `$RUNNER_TEMP` is not always cleared, from accumulating `global-files`
# registrations and plaintext secrets that then leak into unrelated runs.

runs:
  using: composite
  steps:
    - name: Remove Runfile runner state
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/cleanup.sh"
