name: Setup Runfile
description: Installs Runfile and add it to PATH
author: JoaaoVerona

inputs:
  version:
    description: 'Version to install. Defaults to latest. Ignored when `from-source` is true.'
    default: latest
  from-source:
    description: |
      If `true`, build runfile from the current checkout via `cargo build` and
      add `target/debug` to PATH instead of downloading a release archive.
      Used internally to test the working-tree version of the CLI; external
      consumers should leave this unset.
    default: 'false'
  secret-keys:
    description: |
      Optional newline-separated list of private encryption keys (one 64-char hex
      string per line) to make available for decrypting `encrypted:` env values.

      Required when targets in your Runfile decrypt env vars from encrypted .env files.
      Pass GitHub secrets directly here — the action exports them as
      `RUNFILE_PRIVATE_KEYS` for the job, so no OS credential store / keyring daemon
      is involved. The env var disappears with the runner.
    default: ''
  global-targets:
    description: |
      Optional newline-separated list of `.run` files (or directories of them) to
      install into `$HOME/.runfiles/`, the machine-wide target directory `run`
      folds into every listing. Useful for layering CI-only targets on top of the
      project's own `runfiles/`. Paths are resolved relative to the workflow's
      working directory (typically the checkout root).
    default: ''
  runfile-source:
    description: |
      Optional raw `.run` source for a single target. When set, the contents are
      installed into `$HOME/.runfiles/` under `runfile-source-name`, making it
      available machine-wide alongside the project's own targets.

      Intended for repositories that want to keep a target private: pass the
      source via a GitHub secret and the action will materialize it for the job.
      It is removed by the `cleanup` action at the end of the job.
    default: ''
  runfile-source-name:
    description: |
      File name for `runfile-source`. The stem is the target name, so the default
      makes it runnable as `run ci`.
    default: ci.run
  env-file-source:
    description: |
      Optional raw `.env` file source (plaintext or encrypted). When set, the contents
      are written to a temp file on the runner and `RUNFILE_ENV_FILE_TARGET` is exported
      so `run :env inject` and `run :env decrypt` use that file by default when no
      positional path is given.

      Same rationale as `runfile-source`: encrypted env files are safer than plaintext
      ones, but exposing the ciphertext in an open-source repo is unnecessary attack
      surface. Pass the contents via a GitHub secret and the action will materialize
      it for the job. The file lives in `$RUNNER_TEMP` and disappears with the runner.
    default: ''
  clean-runner-state:
    description: |
      If `true` (the default), everything this action leaves outside the workspace
      is removed before it registers or materializes anything, so the job starts
      from a clean slate:

      - `$HOME/.runfiles/`, the machine-wide target directory that
        `global-targets` and `runfile-source` install into;
      - the machine-local state directory holding `state.json`;
      - `$RUNNER_TEMP/runfile-source/`, where `env-file-source` writes.

      This matters on self-hosted runners, where `$HOME` persists between jobs and
      `$RUNNER_TEMP` is not always cleared: a cancelled or failed job would otherwise
      leak its global targets — and the plaintext secrets it
      materialized — into every later run on that machine. Pair with the companion
      `cleanup` action (as an `if: always()` step) to also clear them on the way out.

      Set to `false` on a self-hosted runner whose `$HOME/.runfiles/` is
      configured on purpose and must survive CI.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Resolve target
      if: inputs.from-source != 'true'
      id: target
      shell: bash
      run: |
        # Matched case-insensitively, and on more spellings than GitHub documents, because
        # RUNNER_OS/RUNNER_ARCH are only reliable on GitHub-hosted runners. Gitea's act runner
        # derives both from Go's own runtime whenever a job runs in host mode — which is how
        # every macOS job runs, since macOS containers do not exist — and its translation table
        # is incomplete: GOARCH `amd64` has no entry at all and falls through verbatim, so an
        # Intel Mac reports `amd64` rather than `X64`. Only `darwin` is translated on the OS
        # side, leaving `linux` and `windows` lowercase.
        case "$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')" in
          linux)   os=unknown-linux-musl ;;
          macos)   os=apple-darwin ;;
          windows) os=pc-windows-msvc ;;
          *)       echo "Unsupported OS: $RUNNER_OS" >&2; exit 1 ;;
        esac

        case "$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')" in
          x64|amd64|x86_64) arch=x86_64 ;;
          arm64|aarch64)    arch=aarch64 ;;
          *)                echo "Unsupported arch: $RUNNER_ARCH" >&2; exit 1 ;;
        esac

        # Keyed off the resolved target rather than RUNNER_OS again, so the normalisation above
        # is the only place that has to know about the spellings.
        if [ "$os" = "pc-windows-msvc" ]; then ext=zip; else ext=tar.xz; fi

        echo "target=${arch}-${os}" >> "$GITHUB_OUTPUT"
        echo "ext=${ext}" >> "$GITHUB_OUTPUT"

    - name: Install runfile
      if: inputs.from-source != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        TARGET: ${{ steps.target.outputs.target }}
        EXT: ${{ steps.target.outputs.ext }}
      run: |
        archive="runfile-cli-${TARGET}.${EXT}"

        if [ "$VERSION" = "latest" ]; then
          url="https://github.com/JoaaoVerona/runfile/releases/latest/download/${archive}"
        else
          url="https://github.com/JoaaoVerona/runfile/releases/download/${VERSION}/${archive}"
        fi

        install_dir="$RUNNER_TEMP/runfile-bin"
        mkdir -p "$install_dir"
        curl -fsSL "$url" -o "$RUNNER_TEMP/$archive"

        if [ "$EXT" = "zip" ]; then
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
        else
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
        fi

        # The glob is right here: the archive holds the language server beside
        # the runner and both belong on PATH — an editor talking to a stale one
        # underlines valid files in red.
        mv "$RUNNER_TEMP/runfile-cli-${TARGET}"/run* "$install_dir/"
        echo "$install_dir" >> "$GITHUB_PATH"
        # But not here. It was one binary until 1.0.0 shipped `runfile-lsp` in
        # the archive, and then `run*` expanded to both: the second became the
        # first's argument, and every consumer's job died on `no target named
        # …/runfile-bin/runfile-lsp`. Keyed off `$EXT`, like the extraction
        # above, so the spellings live in one place.
        if [ "$EXT" = "zip" ]; then bin=run.exe; else bin=run; fi
        "$install_dir/$bin" --version

    - name: Build runfile from source
      if: inputs.from-source == 'true'
      shell: bash
      run: |
        cargo build
        bin_dir="$GITHUB_WORKSPACE/target/debug"
        # Case-insensitive for the same reason as the target resolution above.
        case "$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')" in
          windows) bin="$bin_dir/run.exe" ;;
          *)       bin="$bin_dir/run" ;;
        esac
        echo "$bin_dir" >> "$GITHUB_PATH"
        "$bin" --version

    # Runs before the materialize/register steps below (and before any target
    # could read the settings) so the job never inherits leftovers from an earlier
    # one. The script lives in the sibling `cleanup` action because that action is
    # the teardown half of the same job and must do exactly the same thing; the
    # whole repository is materialized when either action is fetched, so the
    # relative path resolves for external consumers too.
    - name: Clean leftover Runfile runner state
      if: inputs.clean-runner-state == 'true'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../cleanup/cleanup.sh"

    # Export keys as `RUNFILE_PRIVATE_KEYS` instead of round-tripping them
    # through an OS credential store. On a single-use runner the keyring buys
    # us nothing — secrets already live in the job's env — and avoiding it
    # skips an apt-get + dbus-launch + gnome-keyring-daemon bootstrap that
    # only exists to support that round trip. `RUNFILE_PRIVATE_KEYS` is read
    # by the CLI's `keyring_keys::all_private_keys`, merged ahead of any
    # keyring blob, and only consulted when the env-build path actually hits
    # an `encrypted:` value.
    - name: Register secret keys
      if: inputs.secret-keys != ''
      shell: bash
      env:
        SECRET_KEYS: ${{ inputs.secret-keys }}
      run: |
        {
          echo 'RUNFILE_PRIVATE_KEYS<<__RUNFILE_KEYS_EOF__'
          printf '%s\n' "$SECRET_KEYS"
          echo '__RUNFILE_KEYS_EOF__'
        } >> "$GITHUB_ENV"

    # Writes into $HOME/.runfiles/ — the directory ../cleanup/cleanup.sh removes.
    # Keep the path in sync with it.
    - name: Materialize Runfile source
      if: inputs.runfile-source != ''
      shell: bash
      env:
        RUNFILE_SOURCE: ${{ inputs.runfile-source }}
        RUNFILE_SOURCE_NAME: ${{ inputs.runfile-source-name }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.runfiles"
        printf '%s\n' "$RUNFILE_SOURCE" > "$HOME/.runfiles/$RUNFILE_SOURCE_NAME"

    - name: Materialize env file source
      if: inputs.env-file-source != ''
      shell: bash
      env:
        ENV_FILE_SOURCE: ${{ inputs.env-file-source }}
      run: |
        path="$RUNNER_TEMP/runfile-source/.env"
        mkdir -p "$(dirname "$path")"
        printf '%s\n' "$ENV_FILE_SOURCE" > "$path"
        echo "RUNFILE_ENV_FILE_TARGET=$path" >> "$GITHUB_ENV"

    # There is no registry to add to any more: a global target is simply a file
    # in $HOME/.runfiles/, so installing one is a copy.
    - name: Install global targets
      if: inputs.global-targets != ''
      shell: bash
      env:
        GLOBAL_TARGETS: ${{ inputs.global-targets }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.runfiles"
        printf '%s\n' "$GLOBAL_TARGETS" | while IFS= read -r line; do
          path="$(printf '%s' "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          [ -z "$path" ] && continue
          if [ -d "$path" ]; then
            cp -R "$path"/. "$HOME/.runfiles/"
          else
            cp "$path" "$HOME/.runfiles/"
          fi
        done
