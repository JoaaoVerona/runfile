name: Setup Runfile
description: Installs Runfile and add it to PATH
author: JoaaoVerona

# Everything this action leaves on the runner is job-scoped: the binary under
# `$RUNNER_TEMP/runfile-bin`, a `$GITHUB_PATH` entry pointing at it, and — when
# `secret-keys` is passed — `RUNFILE_PRIVATE_KEYS` in `$GITHUB_ENV`. Nothing is
# written to `$HOME`, and `run` ignores the machine-wide `runfiles/` directory
# in CI, so a self-hosted runner's own is neither read nor disturbed. That is
# why there is no companion `cleanup` action any more: there is nothing left for
# one job to leak into the next.

inputs:
  version:
    description: |
      The release to install: a tag such as `v1.8.4` (`1.8.4` means the same),
      or `latest` for the newest. Left empty, it is the release this action's own
      ref belongs to, so pinning the action -- `@v1.8.4`, or a commit SHA -- pins
      the binary too, while `@v1`, which moves to each release as it ships, still
      installs the newest. Ignored when `from-source` is true.
    default: ''
  from-source:
    description: |
      If `true`, build runfile from the current checkout via `cargo build` and
      add `target/debug` to PATH instead of downloading a release archive.
      Used internally to test the working-tree version of the CLI; external
      consumers should leave this unset.
    default: 'false'
  secret-keys:
    description: |
      Optional newline-separated list of private encryption keys (one 64-char hex
      string per line) to make available for decrypting `encrypted:` env values.

      Required when targets in your Runfile decrypt env vars from encrypted .env files.
      Pass GitHub secrets directly here — the action exports them as
      `RUNFILE_PRIVATE_KEYS` for the job, so no OS credential store / keyring daemon
      is involved. The env var disappears with the runner.
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve target
      if: inputs.from-source != 'true'
      id: target
      shell: bash
      run: |
        # Matched case-insensitively, and on more spellings than GitHub documents, because
        # RUNNER_OS/RUNNER_ARCH are only reliable on GitHub-hosted runners. Gitea's act runner
        # derives both from Go's own runtime whenever a job runs in host mode — which is how
        # every macOS job runs, since macOS containers do not exist — and its translation table
        # is incomplete: GOARCH `amd64` has no entry at all and falls through verbatim, so an
        # Intel Mac reports `amd64` rather than `X64`. Only `darwin` is translated on the OS
        # side, leaving `linux` and `windows` lowercase.
        case "$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')" in
          linux)   os=unknown-linux-musl ;;
          macos)   os=apple-darwin ;;
          windows) os=pc-windows-msvc ;;
          *)       echo "Unsupported OS: $RUNNER_OS" >&2; exit 1 ;;
        esac

        case "$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')" in
          x64|amd64|x86_64) arch=x86_64 ;;
          arm64|aarch64)    arch=aarch64 ;;
          *)                echo "Unsupported arch: $RUNNER_ARCH" >&2; exit 1 ;;
        esac

        # Keyed off the resolved target rather than RUNNER_OS again, so the normalisation above
        # is the only place that has to know about the spellings.
        if [ "$os" = "pc-windows-msvc" ]; then ext=zip; else ext=tar.xz; fi

        echo "target=${arch}-${os}" >> "$GITHUB_OUTPUT"
        echo "ext=${ext}" >> "$GITHUB_OUTPUT"

    - name: Install runfile
      if: inputs.from-source != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        TARGET: ${{ steps.target.outputs.target }}
        EXT: ${{ steps.target.outputs.ext }}
      run: |
        archive="runfile-cli-${TARGET}.${EXT}"

        # Nothing asked for is the release this action's ref belongs to: the
        # version the Cargo.toml in its own checkout names, which is the tag's at
        # a release tag and the newest release's at `v1`. Defaulting to `latest`
        # meant a pin to `@v1.0.0` or a SHA froze this file and nothing it
        # downloaded -- every run installed whatever was published last (audit
        # SA-036).
        # On Windows the path arrives with backslashes; as slashes, the `..`s
        # after it are ordinary components to whatever reads the path.
        derived=
        if [ -z "$VERSION" ]; then
          manifest="${GITHUB_ACTION_PATH//\\//}/../../../Cargo.toml"
          VERSION="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' "$manifest" | head -n 1)"
          derived=1
          if [ -z "$VERSION" ]; then
            echo "found no version in $manifest; pass \`version:\` to say which release to install" >&2
            exit 1
          fi
        fi

        # The version goes into the URL's path, so it has to be a release tag
        # and nothing else. curl removes dot-segments before it sends a request,
        # so `../../../../someone/else/releases/download/v1` fetched -- and then
        # ran -- an archive from any repository on github.com (audit SA-032).
        # `[[ =~ ]]` matches the whole value, where grep would match a line of
        # it, and C collation keeps the ranges ASCII; `%q` keeps a refused
        # value's newlines out of the log, where a line opening `::` would be
        # read as a workflow command.
        is_release_tag() {
          local LC_ALL=C
          [[ $1 =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
        }
        if [ "$VERSION" = latest ]; then
          url="https://github.com/JoaaoVerona/runfile/releases/latest/download/${archive}"
        elif is_release_tag "$VERSION"; then
          # Every release is tagged with the `v`, as `run :update` assumes too.
          case "$VERSION" in v*) ;; *) VERSION="v$VERSION" ;; esac
          url="https://github.com/JoaaoVerona/runfile/releases/download/${VERSION}/${archive}"
        else
          printf 'invalid version %q: expected `latest`, or a release tag such as v1.2.3\n' "$VERSION" >&2
          exit 1
        fi

        install_dir="$RUNNER_TEMP/runfile-bin"
        mkdir -p "$install_dir"
        # `--path-as-is` sends the path exactly as built, and `--proto` keeps
        # every hop, redirects included, on https.
        if ! curl -fsSL --proto '=https' --path-as-is "$url" -o "$RUNNER_TEMP/$archive"; then
          echo "could not download $url" >&2
          if [ -n "$derived" ]; then
            echo "$VERSION is the release this action's ref belongs to; pass \`version:\` to install another" >&2
          fi
          exit 1
        fi

        if [ "$EXT" = "zip" ]; then
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
        else
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
        fi

        # Named, not globbed. The archive holds one binary — the language
        # server is `run :lsp` — and the spelling is keyed off `$EXT`, like the
        # extraction above, so it lives in one place. A `run*` glob here once
        # expanded to two files when 1.0.0 added `runfile-lsp` beside the
        # runner: the second became the first's argument, and every consumer's
        # job died on `no target named …/runfile-bin/runfile-lsp`.
        if [ "$EXT" = "zip" ]; then bin=run.exe; else bin=run; fi
        mv "$RUNNER_TEMP/runfile-cli-${TARGET}/$bin" "$install_dir/"
        echo "$install_dir" >> "$GITHUB_PATH"
        "$install_dir/$bin" --version

    - name: Build runfile from source
      if: inputs.from-source == 'true'
      shell: bash
      run: |
        cargo build
        bin_dir="$GITHUB_WORKSPACE/target/debug"
        # Case-insensitive for the same reason as the target resolution above.
        case "$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')" in
          windows) bin="$bin_dir/run.exe" ;;
          *)       bin="$bin_dir/run" ;;
        esac
        echo "$bin_dir" >> "$GITHUB_PATH"
        "$bin" --version

    # Export keys as `RUNFILE_PRIVATE_KEYS` instead of round-tripping them
    # through an OS credential store. On a single-use runner the keyring buys
    # us nothing — secrets already live in the job's env — and avoiding it
    # skips an apt-get + dbus-launch + gnome-keyring-daemon bootstrap that
    # only exists to support that round trip. `RUNFILE_PRIVATE_KEYS` is read
    # by the CLI's `keyring_keys::all_private_keys`, merged ahead of any
    # keyring blob, and only consulted when the env-build path actually hits
    # an `encrypted:` value.
    - name: Register secret keys
      if: inputs.secret-keys != ''
      shell: bash
      env:
        SECRET_KEYS: ${{ inputs.secret-keys }}
      run: |
        {
          echo 'RUNFILE_PRIVATE_KEYS<<__RUNFILE_KEYS_EOF__'
          printf '%s\n' "$SECRET_KEYS"
          echo '__RUNFILE_KEYS_EOF__'
        } >> "$GITHUB_ENV"
