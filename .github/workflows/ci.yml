name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # Entry-side bookend to the cleanup step at the end of this job: a previous
      # job on a self-hosted runner may have died without cleaning up after
      # itself. `setup` repeats this internally, for consumers of the action.
      - name: Clean leftover Runfile runner state
        uses: ./.github/actions/cleanup

      # See release.yml: `rustflags: ""` keeps `.cargo/config.toml` in effect.
      # `ci:check` passes `-D warnings` to clippy explicitly, so nothing is lost.
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          rustflags: ""

      - name: Setup Runfile (from source)
        uses: ./.github/actions/setup
        with:
          from-source: true
          global-files: Runfile-ci.json

      - name: Check (format + clippy + type-check)
        run: run ci:check

      - name: Verify Cargo.lock is in sync
        run: git diff --exit-code Cargo.lock

      # The VS Code extension reads the `run :list --json` document this CLI
      # emits. Both live in this repo, so a bumped format version must not
      # silently outrun the extension's parser.
      - name: Verify catalog format version matches the VS Code extension
        run: |
          set -euo pipefail
          emitted=$(run :list --json | sed -n 's/.*"formatVersion": *\([0-9]*\).*/\1/p' | head -n1)
          expected=$(sed -n 's/.*SUPPORTED_FORMAT_VERSION = \([0-9]*\).*/\1/p' editors/vscode/src/pure.ts | head -n1)
          echo "CLI emits formatVersion=$emitted; extension supports $expected"
          test -n "$emitted" && test -n "$expected" && test "$emitted" = "$expected"

      # Composite actions have no `post` step, so the teardown half of `setup` is
      # an explicit step. `always()` so a failed job still clears the global
      # settings it registered and any secret it materialized — self-hosted
      # runners keep `$HOME` between jobs and don't always clear `$RUNNER_TEMP`.
      - name: Cleanup Runfile runner state
        if: always()
        uses: ./.github/actions/cleanup

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # Entry-side bookend to the cleanup step at the end of this job: a previous
      # job on a self-hosted runner may have died without cleaning up after
      # itself. `setup` repeats this internally, for consumers of the action.
      - name: Clean leftover Runfile runner state
        uses: ./.github/actions/cleanup

      # Same as the check job — and here it also makes the windows-2025 leg
      # actually build with `+crt-static`, so the release configuration is
      # exercised on every PR rather than only at tag time.
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          rustflags: ""

      - name: Setup Runfile (from source)
        uses: ./.github/actions/setup
        with:
          from-source: true
          global-files: Runfile-ci.json

      - name: Test
        run: run ci:test

      # Composite actions have no `post` step, so the teardown half of `setup` is
      # an explicit step. `always()` so a failed job still clears the global
      # settings it registered and any secret it materialized — self-hosted
      # runners keep `$HOME` between jobs and don't always clear `$RUNNER_TEMP`.
      - name: Cleanup Runfile runner state
        if: always()
        uses: ./.github/actions/cleanup

  extension:
    name: VS Code extension
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # Entry-side bookend to the cleanup step at the end of this job: a previous
      # job on a self-hosted runner may have died without cleaning up after
      # itself. `setup` repeats this internally, for consumers of the action.
      - name: Clean leftover Runfile runner state
        uses: ./.github/actions/cleanup

      # Must precede setup-node: `cache: pnpm` needs the pnpm binary to resolve
      # the store path. The version comes from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: editors/vscode/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editors/vscode/pnpm-lock.yaml

      # The extension only needs a working `run` to drive its own targets, so the
      # released CLI is enough — no reason to compile the workspace for a `tsc` run.
      - name: Setup Runfile
        uses: ./.github/actions/setup

      - name: Install extension dependencies
        run: run vscode:deps

      - name: Test the extension
        run: run vscode:test

      - name: Compile and package extension
        run: run vscode:package

      - name: Upload .vsix
        uses: actions/upload-artifact@v4.6.2
        with:
          if-no-files-found: error
          name: runfile-vscode-extension
          path: editors/vscode/*.vsix

      # Composite actions have no `post` step, so the teardown half of `setup` is
      # an explicit step. `always()` so a failed job still clears the global
      # settings it registered and any secret it materialized — self-hosted
      # runners keep `$HOME` between jobs and don't always clear `$RUNNER_TEMP`.
      - name: Cleanup Runfile runner state
        if: always()
        uses: ./.github/actions/cleanup
