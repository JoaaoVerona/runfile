name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # See release.yml: `rustflags: ""` keeps `.cargo/config.toml` in effect.
      # `ci:check` passes `-D warnings` to clippy explicitly, so nothing is lost.
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          rustflags: ""

      - name: Setup Runfile (from source)
        uses: ./.github/actions/setup
        with:
          from-source: true

      - name: Check (format + clippy + type-check)
        run: run ci:check

      - name: Verify Cargo.lock is in sync
        run: git diff --exit-code Cargo.lock

      # The VS Code extension reads the `run :list --json` document this CLI
      # emits. Both live in this repo, so a bumped format version must not
      # silently outrun the extension's parser.
      - name: Verify catalog format version matches the VS Code extension
        run: |
          set -euo pipefail
          emitted=$(run :list --json | sed -n 's/.*"formatVersion": *\([0-9]*\).*/\1/p' | head -n1)
          expected=$(sed -n 's/.*SUPPORTED_FORMAT_VERSION = \([0-9]*\).*/\1/p' editors/vscode/src/pure.ts | head -n1)
          echo "CLI emits formatVersion=$emitted; extension supports $expected"
          test -n "$emitted" && test -n "$expected" && test "$emitted" = "$expected"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # Same as the check job — and here it also makes the windows-2025 leg
      # actually build with `+crt-static`, so the release configuration is
      # exercised on every PR rather than only at tag time.
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          rustflags: ""

      - name: Setup Runfile (from source)
        uses: ./.github/actions/setup
        with:
          from-source: true

      - name: Test
        run: run ci:test

  extension:
    name: VS Code extension
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # Must precede setup-node: `cache: pnpm` needs the pnpm binary to resolve
      # the store path. The version comes from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: editors/vscode/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editors/vscode/pnpm-lock.yaml

      # See release.yml: `rustflags: ""` keeps `.cargo/config.toml` in effect.
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          rustflags: ""

      # From source, like every other job here. This one used the released CLI,
      # on the reasoning that driving a few `tsc` targets did not justify
      # compiling the workspace — but the released CLI is a *previous* version
      # of this repository's own task files, so the job breaks exactly when the
      # language changes, which is when CI is most worth having. It did: 0.47.0
      # reads `Runfile.json` and reported no targets at all in `runfiles/`.
      - name: Setup Runfile (from source)
        uses: ./.github/actions/setup
        with:
          from-source: true

      - name: Install extension dependencies
        run: run vscode:setup

      - name: Test the extension
        run: run vscode:test

      # The grammar's tests compile the generated parser with the system C
      # compiler, then parse every target in this repository.
      - name: Set up the tree-sitter grammar
        run: run tree-sitter:setup

      - name: Test the tree-sitter grammar
        run: run tree-sitter:test

      - name: Compile and package extension
        run: run vscode:package

      - name: Upload .vsix
        uses: actions/upload-artifact@v4.6.2
        with:
          if-no-files-found: error
          name: runfile-vscode-extension
          path: editors/vscode/*.vsix

  # The path every consumer takes, and the only one nothing here exercises any
  # more: every other job builds `run` from source — which is what let a broken
  # download reach three projects before this repository noticed. `run*` had
  # matched one binary until 1.0.0 shipped the language server beside it, and
  # then the version check handed the second to the first as a target name.
  #
  # It installs the *published* archive, so it reports on the newest release
  # rather than on the commit being tested: one push late for the release that
  # breaks it, and long before the next consumer runs. Blocking, because the
  # action is how nearly everyone gets this tool.
  action:
    name: Install from the published release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Runfile
        uses: ./.github/actions/setup

      - name: The binary is on PATH and serves the protocol
        run: |
          run --version
          # Fed a shutdown rather than asked for `--version`: `:lsp` does not
          # take one and would sit reading stdin for a request instead. This
          # is what a `command -v runfile-lsp` used to stand in for, and it
          # asks the sharper question -- that the server ships inside the
          # runner and answers, not merely that a second file arrived.
          printf 'Content-Length: 44\r\n\r\n{"jsonrpc":"2.0","id":1,"method":"shutdown"}' |
            run :lsp | grep -q Content-Length
