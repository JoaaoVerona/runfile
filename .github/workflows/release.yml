# GitHub is a mirror. Every release is cut on git.joaoverona.com
# (.cicd/release.yml); this mirrors one here when `run mirror` pushes the
# `github` branch -- the archives the setup action installs, its `v1` alias,
# and the npm package, which only GitHub can publish.
#
# So it runs on that branch rather than on a tag, and releases the version
# Cargo.toml names at the pushed commit, built from that version's tag: a
# mirror pushed a while after a release, with commits past it, still mirrors
# exactly what Gitea released. Several releases between two pushes are
# mirrored as the newest -- npm's `latest` and the `v1` alias only ever want
# that one, and building each would have them race for it. A push that brings
# no new release runs CI and nothing here.
name: Release

on:
  push:
    branches: [github]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release again"
        required: true

jobs:
  resolve:
    name: Find the release to mirror
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.find.outputs.publish }}
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          # Every tag, for the one Cargo.toml names.
          fetch-depth: 0

      # The tags arrive with the branch: `run mirror` pushes it with
      # `--follow-tags`. A version whose tag did not arrive is a push that left
      # them behind, and fails rather than mirroring nothing without a word.
      - name: Find the release to mirror
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Cargo.toml names $tag, which is not on GitHub. Push the tags with the branch; run mirror does."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag" HEAD; then
            echo "::error::$tag is not in the history of $GITHUB_REF_NAME"
            exit 1
          fi
          # Published releases only: GitHub answers a draft's tag with 404, so a
          # release that failed half-way is mirrored again rather than skipped.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          case "$code" in
            200)
              echo "$tag is already released here; nothing to mirror"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "mirroring $tag"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::GitHub answered $code when asked for the release $tag"
              exit 1
              ;;
          esac

  build:
    name: Build (${{ matrix.platform.target }})
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      # `rustflags: ""` is load-bearing: the action defaults to exporting
      # `RUSTFLAGS=-D warnings`, and a set RUSTFLAGS makes Cargo ignore
      # `.cargo/config.toml`'s per-target rustflags outright (env wins, no
      # merge) — which would silently drop `+crt-static` from the Windows
      # binaries and reintroduce the VCRUNTIME140.dll dependency.
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          rustflags: ""
          target: ${{ matrix.platform.target }}

      - name: Install musl tools
        if: contains(matrix.platform.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # From source, never the released CLI. This job runs *during* the release
      # that publishes it, so `latest` is always the previous version -- and a
      # release that changes the task-file format could otherwise never ship.
      # 1.0.0 could not: 0.47.0 reads `Runfile.json` and finds no targets in
      # `runfiles/`. `CARGO_BUILD_TARGET` is deliberately not set for this step,
      # so the bootstrap build is for the host that has to run it.
      - name: Setup Runfile (from source)
        uses: ./.github/actions/setup
        with:
          from-source: true

      - name: Build release binary
        run: run ci:build
        env:
          CARGO_BUILD_TARGET: ${{ matrix.platform.target }}

      - name: Package archive
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.platform.target }}
        run: |
          bin=run
          case "$CARGO_BUILD_TARGET" in *windows*) bin=run.exe ;; esac
          dir="runfile-cli-$CARGO_BUILD_TARGET"
          mkdir "$dir"
          # One file: the language server is `run :lsp`, so the archive holds
          # the runner and nothing that could be an older copy of its parser.
          cp "target/$CARGO_BUILD_TARGET/release/$bin" "$dir/"
          cp README.md "$dir/"
          case "$CARGO_BUILD_TARGET" in
            *windows*) 7z a "$dir.zip" "./$dir" ;;
            *) tar -cJf "$dir.tar.xz" "$dir" ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          if-no-files-found: error
          name: ${{ matrix.platform.target }}
          path: |
            runfile-cli-*.tar.xz
            runfile-cli-*.zip

  extension:
    name: Package VS Code extension
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      # Must precede setup-node: `cache: pnpm` needs the pnpm binary to resolve
      # the store path. The version comes from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: editors/vscode/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editors/vscode/pnpm-lock.yaml

      - name: Verify tag matches the extension version
        working-directory: editors/vscode
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "extension version: $version | tag: ${TAG#v}"
          test "$version" = "${TAG#v}"

      # `rustflags: ""` for the same reason as the build job above.
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          rustflags: ""

      # From source, never the released CLI: this job runs *during* the release
      # that publishes it, so `latest` is always the previous version. A release
      # that changes the task-file format could otherwise never ship — 1.0.0
      # could not, since 0.47.0 reads `Runfile.json`.
      - name: Setup Runfile (from source)
        uses: ./.github/actions/setup
        with:
          from-source: true

      - name: Install extension dependencies
        run: run vscode:setup

      - name: Compile and package extension
        run: run vscode:package --out=runfile-vscode-${TAG#v}.vsix
        env:
          TAG: ${{ needs.resolve.outputs.tag }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          if-no-files-found: error
          name: vscode-extension
          path: editors/vscode/runfile-vscode-*.vsix

  release:
    name: Create GitHub release
    needs: [resolve, build, extension]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Verify tag matches the workspace version
        run: grep -Fxq "version = \"${TAG#v}\"" Cargo.toml
        env:
          TAG: ${{ needs.resolve.outputs.tag }}

      - name: Download artifacts
        uses: actions/download-artifact@v5.0.0
        with:
          merge-multiple: true
          path: dist

      # The same installers as Gitea's, which download from Gitea unless told
      # `RUNFILE_CHANNEL=github` -- `run :update --channel=github` tells them.
      # They are published here too because a binary built before `:update`
      # moved to Gitea runs it against this release's
      # `latest/download/install.sh`, and this copy is what moves it over.
      - name: Stage installers
        run: cp .cicd/release-assets/install.sh .cicd/release-assets/install.ps1 dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > sha256.sum

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --draft --generate-notes
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # `…/actions/setup@v1` is what a consumer writes, so the major tag has to
  # follow the releases -- the same alias `shared-actions` keeps, which its own
  # `release.run` moves as it tags. Here it is a job instead, because a release
  # is six platform builds and an npm publish, and a tag meaning "the newest v1"
  # must not point at a release that never finished. `needs` is the only thing
  # that knows whether it did.
  major-tag:
    name: Move the major tag
    needs: [resolve, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          # The whole history, for the tags the step below compares against.
          fetch-depth: 0

      - name: Point the major tag at this release
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # A pre-release like `v1.0.0-rc.1` is mirrored like any other
          # version, and `v1` has to keep meaning the newest stable one.
          # Skipping is the answer rather than failing: a pre-release is not a
          # mistake, it just is not what the major tag points at.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "$TAG is not a plain release tag; leaving the major tag alone"
            exit 0
          fi
          major="${TAG%%.*}"
          # An alias only ever moves forward. `workflow_dispatch` takes any tag,
          # so re-running an old release to re-upload its assets would otherwise
          # drag every consumer of `@v1` back to it.
          newest=$(git tag --list "$major.*.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$newest" != "$TAG" ]; then
            echo "$TAG is not the newest $major release ($newest); leaving $major alone"
            exit 0
          fi
          echo "moving $major to $TAG"
          git tag -f "$major"
          git push --force origin "refs/tags/$major"

  npm:
    name: Publish npm package
    needs: [resolve, build, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Download artifacts
        uses: actions/download-artifact@v5.0.0
        with:
          merge-multiple: true
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Assemble npm package
        shell: bash
        run: |
          pkg="$RUNNER_TEMP/npm-pkg"
          mkdir -p "$pkg/bin"
          cp npm/package.json "$pkg/"
          cp npm/run.js "$pkg/bin/"
          cp README.md "$pkg/"
          declare -A map=(
            [aarch64-apple-darwin]=darwin-arm64
            [aarch64-pc-windows-msvc]=win32-arm64
            [aarch64-unknown-linux-musl]=linux-arm64
            [x86_64-apple-darwin]=darwin-x64
            [x86_64-pc-windows-msvc]=win32-x64
            [x86_64-unknown-linux-musl]=linux-x64
          )
          for target in "${!map[@]}"; do
            plat="${map[$target]}"
            mkdir -p "$pkg/bin/$plat"
            case "$target" in
              *windows*)
                unzip -q "dist/runfile-cli-$target.zip" -d "$RUNNER_TEMP/x-$target"
                cp "$RUNNER_TEMP/x-$target/runfile-cli-$target/run.exe" "$pkg/bin/$plat/"
                ;;
              *)
                tar -xJf "dist/runfile-cli-$target.tar.xz" -C "$RUNNER_TEMP"
                cp "$RUNNER_TEMP/runfile-cli-$target/run" "$pkg/bin/$plat/"
                chmod +x "$pkg/bin/$plat/run"
                ;;
            esac
          done
          cd "$pkg" && npm pkg set version="${TAG#v}"
          echo "PKG_DIR=$pkg" >> "$GITHUB_ENV"
        env:
          TAG: ${{ needs.resolve.outputs.tag }}

      - name: Publish
        run: npm publish --access public
        working-directory: ${{ env.PKG_DIR }}
