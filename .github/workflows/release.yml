name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true

jobs:
  build:
    name: Build (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # Entry-side bookend to the cleanup step at the end of this job: a previous
      # job on a self-hosted runner may have died without cleaning up after
      # itself. `setup` repeats this internally, for consumers of the action.
      - name: Clean leftover Runfile runner state
        uses: ./.github/actions/cleanup

      # `rustflags: ""` is load-bearing: the action defaults to exporting
      # `RUSTFLAGS=-D warnings`, and a set RUSTFLAGS makes Cargo ignore
      # `.cargo/config.toml`'s per-target rustflags outright (env wins, no
      # merge) — which would silently drop `+crt-static` from the Windows
      # binaries and reintroduce the VCRUNTIME140.dll dependency.
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          rustflags: ""
          target: ${{ matrix.platform.target }}

      - name: Install musl tools
        if: contains(matrix.platform.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # From source, never the released CLI. This job runs *during* the release
      # that publishes it, so `latest` is always the previous version -- and a
      # release that changes the task-file format could otherwise never ship.
      # 1.0.0 could not: 0.47.0 reads `Runfile.json` and finds no targets in
      # `runfiles/`. `CARGO_BUILD_TARGET` is deliberately not set for this step,
      # so the bootstrap build is for the host that has to run it.
      - name: Setup Runfile (from source)
        uses: ./.github/actions/setup
        with:
          from-source: true

      - name: Build release binary
        run: run ci:build
        env:
          CARGO_BUILD_TARGET: ${{ matrix.platform.target }}

      - name: Package archive
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.platform.target }}
        run: |
          bin=run
          case "$CARGO_BUILD_TARGET" in *windows*) bin=run.exe ;; esac
          dir="runfile-cli-$CARGO_BUILD_TARGET"
          mkdir "$dir"
          cp "target/$CARGO_BUILD_TARGET/release/$bin" "$dir/"
          # The language server ships beside the runner: the editor integrations
          # look for it on PATH by name.
          lsp=runfile-lsp
          case "$CARGO_BUILD_TARGET" in *windows*) lsp=runfile-lsp.exe ;; esac
          cp "target/$CARGO_BUILD_TARGET/release/$lsp" "$dir/"
          cp README.md "$dir/"
          case "$CARGO_BUILD_TARGET" in
            *windows*) 7z a "$dir.zip" "./$dir" ;;
            *) tar -cJf "$dir.tar.xz" "$dir" ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          if-no-files-found: error
          name: ${{ matrix.platform.target }}
          path: |
            runfile-cli-*.tar.xz
            runfile-cli-*.zip

      # Composite actions have no `post` step, so the teardown half of `setup` is
      # an explicit step. `always()` so a failed job still clears the global
      # settings it registered and any secret it materialized — self-hosted
      # runners keep `$HOME` between jobs and don't always clear `$RUNNER_TEMP`.
      - name: Cleanup Runfile runner state
        if: always()
        uses: ./.github/actions/cleanup

  extension:
    name: Package VS Code extension
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # Entry-side bookend to the cleanup step at the end of this job: a previous
      # job on a self-hosted runner may have died without cleaning up after
      # itself. `setup` repeats this internally, for consumers of the action.
      - name: Clean leftover Runfile runner state
        uses: ./.github/actions/cleanup

      # Must precede setup-node: `cache: pnpm` needs the pnpm binary to resolve
      # the store path. The version comes from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: editors/vscode/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editors/vscode/pnpm-lock.yaml

      - name: Verify tag matches the extension version
        working-directory: editors/vscode
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "extension version: $version | tag: ${TAG#v}"
          test "$version" = "${TAG#v}"

      # `rustflags: ""` for the same reason as the build job above.
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          rustflags: ""

      # From source, never the released CLI: this job runs *during* the release
      # that publishes it, so `latest` is always the previous version. A release
      # that changes the task-file format could otherwise never ship — 1.0.0
      # could not, since 0.47.0 reads `Runfile.json`.
      - name: Setup Runfile (from source)
        uses: ./.github/actions/setup
        with:
          from-source: true

      - name: Install extension dependencies
        run: run vscode:setup

      - name: Compile and package extension
        run: run vscode:package --out=runfile-vscode-${TAG#v}.vsix
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          if-no-files-found: error
          name: vscode-extension
          path: editors/vscode/runfile-vscode-*.vsix

      # Composite actions have no `post` step, so the teardown half of `setup` is
      # an explicit step. `always()` so a failed job still clears the global
      # settings it registered and any secret it materialized — self-hosted
      # runners keep `$HOME` between jobs and don't always clear `$RUNNER_TEMP`.
      - name: Cleanup Runfile runner state
        if: always()
        uses: ./.github/actions/cleanup

  release:
    name: Create GitHub release
    needs: [build, extension]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Verify tag matches the workspace version
        run: grep -Fxq "version = \"${TAG#v}\"" Cargo.toml
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      - name: Download artifacts
        uses: actions/download-artifact@v5.0.0
        with:
          merge-multiple: true
          path: dist

      - name: Stage installers
        run: cp .github/release-assets/install.sh .github/release-assets/install.ps1 dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > sha256.sum

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --draft --generate-notes
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # `…/actions/setup@v1` is what a consumer writes, so the major tag has to
  # follow the releases -- the same alias `shared-actions` keeps, which its own
  # `release.run` moves as it tags. Here it is a job instead, because the tag
  # only *starts* a release: six platform builds and an npm publish come after
  # it, and a tag meaning "the newest v1" must not point at a release that
  # never finished. `needs` is the only thing that knows whether it did.
  major-tag:
    name: Move the major tag
    needs: [release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          # The whole history, for the tags the step below compares against.
          fetch-depth: 0

      - name: Point the major tag at this release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # This workflow's `v*.*.*` also matches a pre-release like
          # `v1.0.0-rc.1`, and `v1` has to keep meaning the newest stable one.
          # Skipping is the answer rather than failing: a pre-release is not a
          # mistake, it just is not what the major tag points at.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "$TAG is not a plain release tag; leaving the major tag alone"
            exit 0
          fi
          major="${TAG%%.*}"
          # An alias only ever moves forward. `workflow_dispatch` takes any tag,
          # so re-running an old release to re-upload its assets would otherwise
          # drag every consumer of `@v1` back to it.
          newest=$(git tag --list "$major.*.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$newest" != "$TAG" ]; then
            echo "$TAG is not the newest $major release ($newest); leaving $major alone"
            exit 0
          fi
          echo "moving $major to $TAG"
          git tag -f "$major"
          git push --force origin "refs/tags/$major"

  npm:
    name: Publish npm package
    needs: [build, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download artifacts
        uses: actions/download-artifact@v5.0.0
        with:
          merge-multiple: true
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Assemble npm package
        shell: bash
        run: |
          pkg="$RUNNER_TEMP/npm-pkg"
          mkdir -p "$pkg/bin"
          cp npm/package.json "$pkg/"
          cp npm/run.js "$pkg/bin/"
          # The same launcher, named for the second binary it starts.
          cp npm/run.js "$pkg/bin/runfile-lsp.js"
          cp README.md "$pkg/"
          declare -A map=(
            [aarch64-apple-darwin]=darwin-arm64
            [aarch64-pc-windows-msvc]=win32-arm64
            [aarch64-unknown-linux-musl]=linux-arm64
            [x86_64-apple-darwin]=darwin-x64
            [x86_64-pc-windows-msvc]=win32-x64
            [x86_64-unknown-linux-musl]=linux-x64
          )
          for target in "${!map[@]}"; do
            plat="${map[$target]}"
            mkdir -p "$pkg/bin/$plat"
            case "$target" in
              *windows*)
                unzip -q "dist/runfile-cli-$target.zip" -d "$RUNNER_TEMP/x-$target"
                cp "$RUNNER_TEMP/x-$target/runfile-cli-$target/run.exe" "$pkg/bin/$plat/"
                cp "$RUNNER_TEMP/x-$target/runfile-cli-$target/runfile-lsp.exe" "$pkg/bin/$plat/"
                ;;
              *)
                tar -xJf "dist/runfile-cli-$target.tar.xz" -C "$RUNNER_TEMP"
                cp "$RUNNER_TEMP/runfile-cli-$target/run" "$RUNNER_TEMP/runfile-cli-$target/runfile-lsp" "$pkg/bin/$plat/"
                chmod +x "$pkg/bin/$plat/run" "$pkg/bin/$plat/runfile-lsp"
                ;;
            esac
          done
          cd "$pkg" && npm pkg set version="${TAG#v}"
          echo "PKG_DIR=$pkg" >> "$GITHUB_ENV"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      - name: Publish
        run: npm publish --access public
        working-directory: ${{ env.PKG_DIR }}
